
<div style="width: 80%; margin: 10px auto;">
  <div style="text-align: center;">
<button (click)="sharedService.sendMessageToApp1('message')" style="padding: 8px; margin-right: 10px;">Send Message To App1</button>

<div style="border: solid 1px #000; text-align: center; margin-top: 10px; padding: 10px; background-color: bisque; margin-bottom: 20px;">
  <button (click)="incrementApp1('pluse')">+</button>
  <h1>Counter: {{counter() }}</h1>
  <button (click)="decrementApp1('minus')">-</button>
</div>

<div style="text-align: center; width: 50%; padding: 10px; border: solid 1px #000; margin: 0 auto; border-radius:20px;">
  <h3>
    <pre>{{message() | json}}</pre>
  </h3>
</div>
</div>

<router-outlet></router-outlet>
</div>
